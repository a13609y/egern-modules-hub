name: '📺 YouTube: ✨ 增强'
description: 'YouTube 去广告、后台播放、画中画、最高画质与原生下载。

  8 个开关是本仓库生成的 Egern 原生 env_schema（不再是 compat_arguments 占位符）。

  8 个开关默认全部关闭，只有在模块设置页手动打开后才生效。

  上游：IBL3ND/module@bd717c54 · IBL3ND/js@f6b45ea1 · 原始来源 Maasea（Apache-2.0）→ gholts。'
author: Maasea, gholts, IBL3ND（Egern 原生化与整合：a13609y/egern-modules-hub）
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/youtube
icon: play.rectangle.fill
open_url: https://github.com/a13609y/egern-modules-hub/tree/main/rules/youtube
env_schema:
  blockUpload:
    name: 隐藏「上传」入口
    description: 隐藏导航栏中的「上传」入口
    options:
    - 'true'
    - 'false'
  blockShorts:
    name: 隐藏「Shorts」入口
    description: 隐藏导航栏中的「Shorts」入口
    options:
    - 'true'
    - 'false'
  autoHd:
    name: 自动最高画质
    description: 优先使用最高可用画质，并阻止自动降低画质
    options:
    - 'true'
    - 'false'
  blockGames:
    name: 隐藏小游戏推荐
    description: 隐藏 YouTube Playables（小游戏）推荐
    options:
    - 'true'
    - 'false'
  blockVerticalLive:
    name: 隐藏竖屏直播推荐
    description: 隐藏各界面中的竖屏直播推荐
    options:
    - 'true'
    - 'false'
  jumpAhead:
    name: 启用 Jump Ahead
    description: 启用原生「Jump Ahead」跳转按钮，并去除其推广提示
    options:
    - 'true'
    - 'false'
  blockStore:
    name: 隐藏商店和购物板块
    description: 隐藏视频下方和频道主页中的创作者商店、购物板块
    options:
    - 'true'
    - 'false'
  nativeDownload:
    name: 原生下载（实验性）
    description: 实验性原生下载；未设置画质时使用 720p，服务器限制仍可能生效
    options:
    - 'true'
    - 'false'
rules:
- and:
    match:
    - domain_suffix:
        match: googlevideo.com
    - protocol:
        match: UDP
    policy: REJECT
- and:
    match:
    - domain:
        match: youtubei.googleapis.com
    - protocol:
        match: UDP
    policy: REJECT
url_rewrites:
- match: (^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+)
  location: $1$2$3
  status_code: 302
- match: ^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(?:dclk_video_ads|videoplayback\?|initplayback\?)).*[?&]oad(?:=|&|$)
  location: http://reject-video/
- match: ^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads
  location: http://reject-200/
- match: ^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking)
  location: http://reject-200/
- match: ^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext
  location: http://reject-200/
- match: ^https://((?:www|m)\.youtube\.com/api/timedtext\?)([^#]+)&tlang=([^&#]+)&([^#]*)(#.*)?$
  location: https://$1$2&$4&subtype=Translate$5
  status_code: 302
- match: ^https://((?:www|m)\.youtube\.com/api/timedtext\?)([^#]+)&tlang=([^&#]+)(#.*)?$
  location: https://$1$2&subtype=Translate$4
  status_code: 302
- match: ^https://((?:www|m)\.youtube\.com/api/timedtext\?)tlang=([^&#]+)&([^#]*)(#.*)?$
  location: https://$1$3&subtype=Translate$4
  status_code: 302
- match: ^https://((?:www|m)\.youtube\.com/api/timedtext\?)tlang=([^&#]+)(#.*)?$
  location: https://$1subtype=Translate$3
  status_code: 302
scriptings:
- http_request:
    name: youtube.single.ad-break
    match: ^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/player\/ad_break(?:\?.*)?$
    script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/youtube/youtube-request.js
    env:
      blockUpload: 'false'
      blockShorts: 'false'
      autoHd: 'false'
      blockGames: 'false'
      blockVerticalLive: 'false'
      jumpAhead: 'false'
      blockStore: 'false'
      nativeDownload: 'false'
- http_response:
    name: youtube.single.download
    match: ^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/offline\/get_download_action(?:\?.*)?$
    script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/youtube/youtube-response.js
    max_size: -1
    body_required: true
