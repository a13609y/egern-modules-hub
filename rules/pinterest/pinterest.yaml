# [DOC] https://egernapp.com/zh-CN/docs/configuration/body_rewrites（核对：2026-06-03）
# response_jq 支持 match（完整 URL 正则）和必填 filter；无需脚本或 body_required。
# [SRC] https://raw.githubusercontent.com/axtyet/Luminous/main/Repcz/Surge/Module/Kelee/Pinterest_remove_ads.sgmodule
# 保持上游两条 URL 白名单及其“路径尾随 / 且紧接 ?”的匹配范围，不扩展到其他路径、HTTP 或无查询串 URL。
name: Pinterest 去广告（原生）
description: 仅移除首页流和相关内容接口 data 数组中不满足上游 is_promoted=false/"false" 条件的条目。
author: 可莉
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/pinterest
icon: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/icon.png

rules:
  - domain:
      match: ads.pinterest.com
      policy: REJECT
  - domain:
      match: ad.pinterest.com
      policy: REJECT
  - domain:
      match: ct.pinterest.com
      policy: REJECT
  - domain:
      match: trk.pinterest.com
      policy: REJECT

mitm:
  hostnames:
    - api.pinterest.com

body_rewrites:
  - response_jq:
      match: '^https://api\.pinterest\.com/v\d+/feeds/home/\?'
      filter: '.data |= map(select(.is_promoted == false or .is_promoted == "false"))'
  - response_jq:
      match: '^https://api\.pinterest\.com/v\d+/pins/\d+/related/modules/\?'
      filter: '.data |= map(select(.is_promoted == false or .is_promoted == "false"))'
