name: sync-foreign-domains

on:
  schedule:
    - cron: "23 5 * * *" # 每天 05:23 UTC（北京时间 13:23）
  workflow_dispatch:
  push:
    paths:
      - "rulesets/foreign-domains/**"
      - ".github/workflows/sync-foreign-domains.yml"

permissions:
  contents: write

concurrency:
  group: sync-foreign-domains
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 拉上游 → 重生成规则集
        run: python3 rulesets/foreign-domains/sync.py

      - name: 静态校验
        run: |
          python3 - <<'PY'
          import yaml, re
          d = yaml.safe_load(open('rulesets/foreign-domains/foreign-domains.yaml'))
          suf = d.get('domain_suffix_set') or []
          assert len(suf) >= 10000, f'后缀条目太少: {len(suf)}'
          assert len(suf) == len(set(suf)), '有重复后缀'
          # 中国域名不该出现在国外集里
          bad = [x for x in suf if x in ('qq.com','baidu.com','bilibili.com','taobao.com','jd.com')]
          assert not bad, f'中国域名残留: {bad}'
          # 危险项
          assert 'com' not in suf and 'cn' not in suf, '出现裸 TLD'
          assert d.get('no_resolve') is True, '缺少 no_resolve: true'
          g = d.get('geoip_set') or []
          assert len(g) >= 200, f'GeoIP 国家代码太少: {len(g)}'
          assert 'CN' not in g, 'GeoIP 里出现了 CN'
          for r in d.get('domain_regex_set') or []:
              re.compile(r)
          with open('rulesets/foreign-domains/foreign-domains.txt') as f:
              assert f.read().count('DOMAIN-SUFFIX,') == len(suf)
          print(f'ok: 后缀 {len(suf)} / 精确 {len(d.get("domain_set") or [])} / 正则 {len(d.get("domain_regex_set") or [])} / GeoIP {len(g)}')
          PY

      # ── 发布前门禁 ────────────────────────────────────────────────
      # 与 PR CI 同一条命令（sh scripts/check_all.sh，见 validate.yml），只在
      # 本次同步真的改动了规则集产物时才跑；它一旦非零退出，下面的「提交变化」
      # 就不会执行 —— 失败即不发布，工作流保持红。
      # 被检的是数据产物（sync.py 只写 yaml/txt），门禁跑的都是本仓库自身脚本，
      # 不会执行任何来自上游的代码。
      - name: 产物是否有变化
        id: diff
        run: |
          if [ -n "$(git status --porcelain rulesets/foreign-domains)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::规则集产物有变化，将跑发布前门禁"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::规则集产物无变化，跳过发布前门禁"
          fi

      - uses: actions/setup-python@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: "22"

      - name: 安装门禁依赖（唯一第三方依赖：pyyaml）
        if: steps.diff.outputs.changed == 'true'
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2

      - name: 发布前门禁（与 PR CI 同一命令）
        if: steps.diff.outputs.changed == 'true'
        run: sh scripts/check_all.sh

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain rulesets/foreign-domains)" ]; then
            git add rulesets/foreign-domains
            git commit -m "chore(foreign-domains): 跟随上游更新 $(date -u +%F)"
            git push
            echo "::notice::已同步上游更新"
          else
            echo "上游无变化"
          fi
