name: validate

# 贡献改动的门禁：核心检查与本地完全一致 —— 都是 `sh scripts/check_all.sh`。
# 只读校验，不提交、不推送，也不碰每日 sync-*.yml 同步流。
#
# 与本地唯一的差别：这里多一步「提交范围内的空白/冲突残留」（base..HEAD）。
# CI 检出的工作区是干净的，`git diff --check` 在 CI 里永远为空，所以必须显式给
# 提交范围；本地 check_all.sh 里那一步查的是你尚未提交的工作区改动，两者互补。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖（唯一第三方依赖：pyyaml）
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2

      # 一个步骤跑完全部检查，顺序与本地相同：
      # check_repo.py → china/verify.py → bilibili test.mjs → coolapk test.mjs（临时目录）
      # → scripts/tests/test_bilibili_toggles.py → git diff --check（空，见下一步说明）
      - name: 仓库门禁（与本地同一命令）
        run: sh scripts/check_all.sh

      # CI 专用：提交范围内的空白与冲突残留。本地无法覆盖这段范围。
      - name: 空白与冲突残留（提交范围）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null) || base=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$base" HEAD
