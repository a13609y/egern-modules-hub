name: sync-bilibili-redirect

on:
  schedule:
    - cron: "17 4 * * *" # 每天 04:17 UTC 重新生成
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bilibili-redirect
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
      - name: 重新生成（上游异常时保留上一版并失败）
        working-directory: rules/bilibili-redirect
        run: python3 sync.py
      - name: 静态校验
        working-directory: rules/bilibili-redirect
        run: |
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open('bilibili-redirect.yaml', encoding='utf-8'))
          for k in ('name', 'compat_arguments', 'compat_arguments_desc', 'env_schema', 'scriptings', 'mitm'):
              assert d.get(k), f'缺少 {k}'
          assert len(d['scriptings']) == 7, 'scriptings 数量异常'
          assert all('a13609y/egern-modules-hub' in s['http_request']['script_url'] for s in d['scriptings'])
          assert {'true', 'false'} == set(next(iter(d['env_schema'].values()))['options'])
          js = open('bilibili-redirect.bundle.js', encoding='utf-8').read()
          head = js.split('// ── 上游 bundle 原样执行')[0]
          assert 'globalThis.$done =' not in head and 'setTimeout' not in head, '前缀不应接管 $done / 定时器'
          print('module ok:', len(d['env_schema']), 'switches,', len(d['scriptings']), 'scriptings')
          PY
      - name: 提交变化
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain rules/bilibili-redirect)" ]; then
            git add rules/bilibili-redirect/bilibili-redirect.yaml rules/bilibili-redirect/bilibili-redirect.bundle.js
            git commit -m "chore(bilibili-redirect): 跟随上游重新生成"
            git push origin HEAD:main
          else
            echo "上游无内容变化"
          fi
