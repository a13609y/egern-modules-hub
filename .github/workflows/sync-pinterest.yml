name: sync-pinterest

on:
  schedule:
    - cron: "53 3 * * *" # 每天 03:53 UTC（北京时间 11:53）跟一次上游
  workflow_dispatch:
  push:
    paths:
      - "rules/pinterest/**"
      - ".github/workflows/sync-pinterest.yml"

permissions:
  contents: write

concurrency:
  group: sync-pinterest
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉上游 → 重生成原生模块
        run: python3 rules/pinterest/sync.py

      - name: 静态校验
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
          python3 - <<'PY'
          import json, re, subprocess, yaml
          d = yaml.safe_load(open('rules/pinterest/pinterest.yaml', encoding='utf-8'))
          assert d.get('mitm', {}).get('hostnames') == ['api.pinterest.com']
          assert 'scriptings' not in d, '原生版不得生成 scriptings'
          rules = [x['response_jq'] for x in d.get('body_rewrites', [])]
          assert len(rules) == 2, f'response_jq 应为 2 条，实际 {len(rules)}'
          assert all(set(r) == {'match', 'filter'} for r in rules)
          expected = [
              r'^https://api\.pinterest\.com/v\d+/feeds/home/\?',
              r'^https://api\.pinterest\.com/v\d+/pins/\d+/related/modules/\?',
          ]
          assert [r['match'] for r in rules] == expected, '路径白名单偏离上游'
          payload = {'data': [{'id': 'keep-bool', 'is_promoted': False}, {'id': 'keep-str', 'is_promoted': 'false'}, {'id': 'drop', 'is_promoted': True}], 'untouched': 1}
          for rule in rules:
              out = subprocess.run(['jq', rule['filter']], input=json.dumps(payload), text=True, capture_output=True, check=True)
              assert [x['id'] for x in json.loads(out.stdout)['data']] == ['keep-bool', 'keep-str']
          print('module ok: 2 response_jq / jq parity ok')
          PY

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain rules/pinterest)" ]; then
            git add rules/pinterest
            git commit -m "chore(pinterest): 跟随上游更新 $(date -u +%F)"
            git push
            echo "::notice::已同步上游更新"
          else
            echo "上游无变化"
          fi
