name: 全国实时油价
description: 92/95/98 号汽油与柴油实时油价小组件 v4.7.2 · 涨跌预测（官方文档接口，北京时间每天最多 1 次请求、失败不即时重试、429 遵从服务封停；缺有效数据写「暂无预测」）· 预测显示四油品元/升区间（只有统一吨价时按汽油 0.725 / 柴油 0.835 kg/L 估算；同值不强做区间）· 全宽自适应布局（横向不写死像素：四卡用 flex 均分、整宽行由弹性元素撑满，338/345/364 等真实宽度左右留白一致；v4.7.1 按真机截图修整：卡内「标签 + 价格」用对称无长度 spacer 作为一个紧凑组双轴居中，大号图注居中；v4.7.2 再按真机截图精修：小号底行改成两行信息块（「预测 + 放大到 14pt 带色幅度」+「下轮 + 真实下轮时间」，竖向预算 157/158 不溢出，消除卡片底部白边），中号走势图去掉两侧弹性 spacer、由 flex 撑满左栏（名义宽 205→246，窄机型兜底不越界），右栏仍 3:1 不被挤压）· 小/中/大号三套布局（小号四油品 2×2 田字格 + 两行信息块（上「方向 + 数值/区间」14pt 粗体、下「下轮 + 预计时间」9pt） / 中号四卡加折线图 + 右栏三块（严格等高 36pt）：最近调价·涨跌预测·下轮预计调价时间（标题仅「涨跌预测」，数值不带约与单位） / 大号完整信息，预测位取代原最近调价（标题仅「涨跌预测」，数值带「约」与元/升）） · 走势用 BesFuel 逐期核实的发改委调价历史（地区/油号严格对应，不调整画空心点、缺表断线；最多最近 10 轮真实节点，普通折线 + 浅橙渐变面积 + 绿色末点）· 现价源 m.qiyoujiage.com
author: Egern 群友 @iBL3ND
homepage: https://github.com/a13609y/egern-modules-hub
icon: fuelpump.fill

# ── 模块参数默认值（用户可在「模块设置」里覆盖）────────────────
compat_arguments:
  region: hainan/haikou
  SHOW_TREND: "true"
  REFRESH_HOURS: 6
  FUEL: "95"
  FULL_LITERS: "50"
  FORECAST: "true"
  OIL_API_KEY: ""

compat_arguments_desc: |
  地区写省份/城市，拼音（fujian、hainan/haikou）或中文（福建、海口、广东深圳）都行。走势图只画最近 10 个真实调价节点。
  FUEL 决定走势折线与「加满」金额用哪个油品（小号固定显示 92/95/98/柴油四格）；FULL_LITERS 决定按多少升算加满。

# ── 模块设置页自动生成的 UI 控件 ────────────────────────────
env_schema:
  region:
    name: 地区
    description: 省份/城市，拼音或中文均可。例如 hainan/haikou、guangdong/shenzhen、福建、海口、广东深圳。城市页不存在时自动退回省级页。
    default_value: hainan/haikou
  SHOW_TREND:
    name: 显示走势与调价信息（默认打开）
    description: 默认打开（未在模块设置里改过也是打开的）。打开后中/大号显示官方核价折线面积图与调价信息（最近 10 轮真实节点，缺口断线；优先下轮：有真实下轮幅度才显示「预测」，只有窗口日期时主信息为最近调价、下轮仅注日期标预计）；历史来自 BesFuel 已核实的发改委公告节点（元/升），未收录的价区/油号不画曲线
    options:
      - "true"
      - "false"
    default_value: "true"
  FUEL:
    name: 重点油品
    description: 走势折线、「加满」金额使用的油品（小号固定显示四油品）
    options:
      - "92"
      - "95"
      - "98"
      - "柴油"
    default_value: "95"
  FULL_LITERS:
    name: 加满升数
    description: 大号「加满」金额按多少升计算，默认 50
    default_value: "50"
  FORECAST:
    name: 涨跌预测（默认打开）
    description: 打开后按官方文档接口取「涨跌预测 / 下轮调价时间」，幅度统一显示四油品元/升区间（接口只给统一吨价时，汽油按 0.725 kg/L、柴油按 0.835 kg/L 分别换算成两头区间，如 ↓0.28-0.33，大号带「约」与元/升；有分油号数据则逐油品换算；同值不强做区间；换算不可靠则「暂无预测」），北京时间每天最多请求 1 次（失败也算，不即时重试，429 当天封停）；缺有效数据时显示「暂无预测」，绝不拿历史或推算冒充
    options:
      - "true"
      - "false"
    default_value: "true"
  OIL_API_KEY:
    name: API Key（可留空）
    description: 极数本源 API Key，只保存在本机 Egern 参数里，默认留空即匿名（文档：每天 5 次）。本模块不会把 Key 写入仓库、日志或任何缓存
    default_value: ""
  REFRESH_HOURS:
    name: 刷新间隔（小时）
    description: 小组件刷新提示间隔，实际刷新由系统调度，不保证精确（1~24）
    default_value: "6"

dns: {}

scriptings:
  - generic:
      name: oil-price
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/widgets/oil-price/oil-price.js
      timeout: 20
      env:
        region: "{{{region}}}"
        SHOW_TREND: "{{{SHOW_TREND}}}"
        REFRESH_HOURS: "{{{REFRESH_HOURS}}}"
        FUEL: "{{{FUEL}}}"
        FULL_LITERS: "{{{FULL_LITERS}}}"
        FORECAST: "{{{FORECAST}}}"
        OIL_API_KEY: "{{{OIL_API_KEY}}}"

widgets:
  - name: 实时油价
    script_name: oil-price
