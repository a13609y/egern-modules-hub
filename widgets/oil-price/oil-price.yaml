name: 全国实时油价
description: 92/95/98 号汽油与柴油实时油价小组件 · 小/中/大号三套布局（四油品 2×2 田字格，标题与时间同一行 / 四油品+加高走势 / 完整信息）· 调价信息优先下轮：只有真实下轮幅度才标「预测」，仅有窗口日期时显示最近调价 + 下轮日期并注明预计/仅日期 · 走势用 BesFuel 逐期核实的发改委调价历史（地区/油号严格对应，不调整画空心点、缺表断线；最多最近 10 轮真实节点，普通折线 + 浅橙渐变面积 + 绿色末点） · 现价源 m.qiyoujiage.com，历史源 BesFuel（MIT 代码，数据为公告事实）
author: Egern 群友 @iBL3ND
homepage: https://github.com/a13609y/egern-modules-hub
icon: fuelpump.fill

# ── 模块参数默认值（用户可在「模块设置」里覆盖）────────────────
compat_arguments:
  region: hainan/haikou
  SHOW_TREND: "true"
  REFRESH_HOURS: 6
  FUEL: "95"
  FULL_LITERS: "50"

compat_arguments_desc: |
  地区写省份/城市，拼音（fujian、hainan/haikou）或中文（福建、海口、广东深圳）都行。走势图只画最近 10 个真实调价节点。
  FUEL 决定走势折线与「加满」金额用哪个油品（小号固定显示 92/95/98/柴油四格）；FULL_LITERS 决定按多少升算加满。

# ── 模块设置页自动生成的 UI 控件 ────────────────────────────
env_schema:
  region:
    name: 地区
    description: 省份/城市，拼音或中文均可。例如 hainan/haikou、guangdong/shenzhen、福建、海口、广东深圳。城市页不存在时自动退回省级页。
    default_value: hainan/haikou
  SHOW_TREND:
    name: 显示走势与调价信息
    description: 打开后中/大号显示官方核价折线面积图与调价信息（最近 10 轮真实节点，缺口断线；优先下轮：有真实下轮幅度才显示「预测」，只有窗口日期时主信息为最近调价、下轮仅注日期标预计）；历史来自 BesFuel 已核实的发改委公告节点（元/升），未收录的价区/油号不画曲线
    options:
      - "true"
      - "false"
  FUEL:
    name: 重点油品
    description: 走势折线、「加满」金额使用的油品（小号固定显示四油品）
    options:
      - "92"
      - "95"
      - "98"
      - "柴油"
    default_value: "95"
  FULL_LITERS:
    name: 加满升数
    description: 大号「加满」金额按多少升计算，默认 50
    default_value: "50"
  REFRESH_HOURS:
    name: 刷新间隔（小时）
    description: 小组件刷新提示间隔，实际刷新由系统调度，不保证精确（1~24）
    default_value: "6"

dns: {}

scriptings:
  - generic:
      name: oil-price
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/widgets/oil-price/oil-price.js
      timeout: 20
      env:
        region: "{{{region}}}"
        SHOW_TREND: "{{{SHOW_TREND}}}"
        REFRESH_HOURS: "{{{REFRESH_HOURS}}}"
        FUEL: "{{{FUEL}}}"
        FULL_LITERS: "{{{FULL_LITERS}}}"

widgets:
  - name: 实时油价
    script_name: oil-price
